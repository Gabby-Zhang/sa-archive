name: 每周数据备份

on:
  schedule:
    - cron: '0 3 * * 1'   # 每周一凌晨 3 点（UTC）
  workflow_dispatch:        # 允许手动触发

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install supabase

      - name: 导出全部数据表
        run: python scripts/backup_tables.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 上传备份 artifact（保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90

      - name: 失败时推送 ntfy 通知
        if: failure()
        run: |
          curl -s -H "Title: sa-archive 备份失败" -H "Tags: warning" \
               -d "每周数据备份 workflow 失败，请检查 GitHub Actions 日志" \
               https://ntfy.sh/ss-calendar-update
