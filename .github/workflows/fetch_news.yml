name: 定时抓取新闻与日程

on:
  schedule:
    - cron: '0 8,14,20 * * *'   # 每天伦敦时间约 08:00、14:00、20:00（UTC，夏令时时差1小时）
  workflow_dispatch:              # 允许手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install supabase feedparser requests

      - name: 抓取新闻
        run: python scripts/fetch_news.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 抓取 Attal 国民议会日程
        run: python scripts/fetch_an_schedule.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 失败时推送 ntfy 通知
        if: failure()
        run: |
          curl -s -H "Title: sa-archive 新闻抓取失败" -H "Tags: warning" \
               -d "定时抓取 workflow 失败（新闻或 AN 日程），请检查 GitHub Actions 日志" \
               https://ntfy.sh/ss-calendar-update
