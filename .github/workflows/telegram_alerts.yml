name: Telegram failure alerts

# 本仓库任一 workflow 失败 → Telegram 机器人推一条「⚠️ xxx 失败」+ run 链接。
# 第二告警通道:Playbook 的 Gmail 告警在 Gmail 密码失效时自己也发不出来;
# 其它 workflow 原来只有 ntfy 或干脆没有通知。
# 新增 workflow 时把它的 name 加进下面的列表(workflow_run 只认名字)。
# Telegram screenshot ingest 不在列表里:它失败时自己会在 Telegram 里回复。

on:
  workflow_run:
    workflows:
      - "Add news item (manual)"
      - "Add schedule entry (manual)"
      - "每日纪念日提醒"
      - "每日新闻链接存档"
      - "每周数据备份"
      - "定时抓取新闻与日程"
      - "Paris Playbook ingest"
      - "Sync schedule → 大事记"
      - "Telegram realtime push"
      - "Telegram daily summary"
    types: [completed]

jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram alert
        env:
          TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT:    ${{ secrets.TELEGRAM_CHAT_ID }}
          NAME:    ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          text = f"⚠️ sa-archive · {os.environ['NAME']} 失败\n{os.environ['RUN_URL']}"
          for chat in os.environ["CHAT"].split(","):
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{os.environ['TOKEN']}/sendMessage",
                  data=json.dumps({"chat_id": chat.strip(), "text": text,
                                   "link_preview_options": {"is_disabled": True}}).encode(),
                  headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=30).close()
          PY
